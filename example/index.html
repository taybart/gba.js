<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GBA.js</title>
<style>
  body {
    font-family: sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  canvas {
    image-rendering: pixelated;
    border: 4px solid #444;
    border-radius: 4px;
    background: #000;
  }
  #controls {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(4, 60px);
    gap: 8px;
    justify-content: center;
  }
  button {
    padding: 12px 8px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background: #e94560;
    color: white;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
  }
  button:active {
    background: #ff6b81;
  }
  #file-input {
    margin: 16px 0;
  }
</style>
</head>
<body>
<h1>GBA.js</h1>
<canvas id="screen" width="480" height="320"></canvas>

<div id="file-input">
  <input type="file" id="rom" accept=".gba">
  <button id="run">Run ROM</button>
</div>

<div id="controls">
  <div></div>
  <button data-btn="6">Up</button>
  <div></div>
  <button data-btn="3">Start</button>

  <button data-btn="5">Left</button>
  <button data-btn="7">Down</button>
  <button data-btn="4">Right</button>
  <button data-btn="2">Select</button>

  <div></div>
  <div></div>
  <div></div>
  <button data-btn="8">R</button>

  <button data-btn="1">B</button>
  <button data-btn="0">A</button>
  <div></div>
  <button data-btn="9">L</button>
</div>

<script type="module">
  // Served by `npm run dev` (http://localhost:5173/example/), straight from
  // src/ with the BIOS built in. A page using the built library imports
  // dist/gba.js the same way.
  import GBA from '/src/index-embedded.js';

  const canvas = document.getElementById('screen');
  const gba = new GBA({ bindInput: false });
  gba.setCanvas(canvas);

  document.getElementById('run').addEventListener('click', () => {
    const file = document.getElementById('rom').files[0];
    if (!file) return alert('Select a ROM first');
    gba.loadRomFromFile(file, result => {
      if (result) {
        gba.runStable();
      } else {
        alert('Failed to load ROM');
      }
    });
  });

  // Wire up on-screen buttons
  const buttons = document.querySelectorAll('#controls button[data-btn]');
  buttons.forEach(btn => {
    const code = parseInt(btn.dataset.btn, 10);
    const press = () => gba.press(code);
    const release = () => gba.release(code);
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
    btn.addEventListener('touchstart', e => { e.preventDefault(); press(); });
    btn.addEventListener('touchend', e => { e.preventDefault(); release(); });
  });
</script>
</body>
</html>
